name: Build Windows & Linux VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (VST3 & Standalone)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (MSVC)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Artifacts
        run: |
          mkdir dist
          Compress-Archive -Path build/AuraCompressor_artefacts/Release/VST3/AuraCompressor.vst3 -DestinationPath dist/AuraCompressor_Windows_VST3.zip
          Compress-Archive -Path build/AuraCompressor_artefacts/Release/Standalone/AuraCompressor.exe -DestinationPath dist/AuraCompressor_Windows_Standalone.zip

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: AuraCompressor-Windows-VST3
          path: dist/AuraCompressor_Windows_VST3.zip

      - name: Upload Windows Standalone
        uses: actions/upload-artifact@v4
        with:
          name: AuraCompressor-Windows-Standalone
          path: dist/AuraCompressor_Windows_Standalone.zip

  build-linux:
    name: Build Linux (VST3 & Standalone)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev ninja-build

      - name: Configure CMake (Ninja)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          ninja -C build

      - name: Package Linux Artifacts
        run: |
          mkdir dist
          tar -czf dist/AuraCompressor_Linux_VST3.tar.gz -C build/AuraCompressor_artefacts/Release/VST3 AuraCompressor.vst3
          tar -czf dist/AuraCompressor_Linux_Standalone.tar.gz -C build/AuraCompressor_artefacts/Release/Standalone AuraCompressor

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraCompressor-Linux-Binaries
          path: dist/*.tar.gz
